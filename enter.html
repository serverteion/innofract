<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="innofract - Experimental netlabel exploring the boundaries of digital sound">
  <title>innofract</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="images/innofract_logo_001_black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <style>
    .home-logo-link { position: relative; display: inline-block; }
    #particle-canvas { position: absolute; inset: -60px; pointer-events: none; z-index: 0; }
    .home-logo-link img { position: relative; z-index: 1; display: block; }
    body {
      background: var(--bg) url('images/homebackground.gif') center center / cover no-repeat fixed;
      background-blend-mode: multiply;
    }
  </style>
</head>
<body class="home-page">
  <main class="home-main">
    <a href="index.html" class="home-logo-link" aria-label="innofract - Enter">
      <canvas id="particle-canvas" aria-hidden="true"></canvas>
      <img src="images/innofract_logo_003_white.png" alt="innofract Logo" width="400">
    </a>
    <footer class="site-footer" role="contentinfo" style="margin-top: 24px;">
      <p>innofract &copy; 2026</p>
    </footer>
  </main>
  
  <script>
    (() => {
      const link = document.querySelector('.home-logo-link');
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let animationId = null;
      let isHovering = false;
      let emissionRect = { x: 0, y: 0, w: 0, h: 0 };

      function resizeCanvas() {
        const rect = link.getBoundingClientRect();
        canvas.width = rect.width + 120;
        canvas.height = rect.height + 120;
        // Emission rectangle: centered on logo text area
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        // Logo is 400x120 in SVG, scale to actual rendered size
        const scale = rect.width / 400;
        emissionRect.w = rect.width * 0.65; // Narrower: ~65% of logo width
        emissionRect.h = rect.height * 0.82; // Slightly narrower than before
        emissionRect.x = cx - emissionRect.w / 2;
        emissionRect.y = cy - emissionRect.h / 2 - rect.height * 0.02;
      }

      class Particle {
        constructor() {
          // Spawn from random position on the front face of the emission rectangle
          this.x = emissionRect.x + Math.random() * emissionRect.w;
          this.y = emissionRect.y + Math.random() * emissionRect.h;
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
          const speed = Math.random() * 0.35 + 0.2;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.life = 1;
          this.decay = Math.random() * 0.003 + 0.002;
          this.baseSize = Math.random() * 4 + 3;
          this.size = this.baseSize;
          this.hue = Math.random() > 0.6 ? 0 : 30;
          this.sat = Math.random() > 0.6 ? 0 : 15;
          this.light = 85 + Math.random() * 10;
          this.twinklePhase = Math.random() * Math.PI * 2;
          this.twinkleSpeed = Math.random() * 0.05 + 0.02;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.992;
          this.vy *= 0.992;
          this.life -= this.decay;
          this.twinklePhase += this.twinkleSpeed;
          const twinkle = (Math.sin(this.twinklePhase) * 0.5 + 0.5) * 0.4 + 0.6;
          this.size = this.baseSize * twinkle * this.life;
        }

        draw() {
          if (this.life <= 0 || this.size < 0.5) return;
          const alpha = this.life * 0.5;
          ctx.globalAlpha = alpha;
          const l = Math.round(this.light * this.life + 10 * Math.sin(this.twinklePhase));
          ctx.fillStyle = `hsl(${this.hue}, ${this.sat}%, ${l}%)`;
          ctx.shadowColor = `hsl(${this.hue}, ${this.sat}%, ${Math.min(95, l + 15)}%)`;
          ctx.shadowBlur = this.size * 1.5;
          ctx.beginPath();
          ctx.arc(this.x, this.y, Math.max(0.5, this.size), 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      function spawnParticle() {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (isHovering && Math.random() < 0.35) {
          spawnParticle();
        }
        
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        
        animationId = requestAnimationFrame(animate);
      }

      link.addEventListener('mouseenter', () => {
        isHovering = true;
        resizeCanvas();
        if (!animationId) animate();
      });

      link.addEventListener('mouseleave', () => {
        isHovering = false;
      });

      window.addEventListener('resize', resizeCanvas);
    })();
  </script>
</body>
</html>
