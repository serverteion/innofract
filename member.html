<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="innofract - Member. Experimental electronic, ambient, and digital soundscapes.">
  <title>innofract</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="images/innofract_logo_001_black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <style>
    * { paint-order: stroke fill; stroke: #6a6a6a; stroke-width: 0.5px; }
  </style>
</head>
<body>
  <!-- Header injected by script.js -->
  <div id="site-header"></div>
  
  <main>
    <section class="members-section" aria-labelledby="members-title">
      <h1 id="members-title" class="releases-title">MEMBER</h1>
      <div id="members-list" class="members-list"></div>
    </section>
  </main>
  
  <footer class="site-footer" role="contentinfo">
    <p>innofract &copy; 2026</p>
  </footer>
  
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('members-list');
      if (!container) return;
      
      const members = [
        { name: 'Supire', role: 'Owner / Music / Design / Mastering', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/supire_icon.png' },
        { name: 'Amebre Kizami', role: 'Label / Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/amebre_kizami_icon.png' },
        { name: 'kyou1110', role: 'Label / Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/kyou1110_icon.png' },
        { name: 'Shishamo', role: 'Programming', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/shishamo_icon.png' },
        { name: 'oblivious', role: 'Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/ovlivious_icon.png' },
        { name: 'goropi', role: 'Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/goropi_icon.png' },
        { name: 'スパゲテー', role: 'Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/spgtea_icon.png' },
		    { name: 'melónet', role: 'Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/melonet_icon.png' },
        { name: 'ETH4N', role: 'Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/eth4n_icon.png' },
        { name: 'すてらべえ', role: 'Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/stellabee_icon.png' },
        { name: 'danretsu', role: 'Observer / Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/danretsu_icon.png' },
        { name: 'Ko-Shan', role: 'Observer / Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/ko_shan_icon.png' },
        { name: 'Solfrail', role: 'Admin / Programming', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/solfrail_icon.png' },
        { name: 'Junk Summer', role: 'Admin / Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/junk_summer_icon.png' },
        { name: 'elli mia', role: 'Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/elli_mia_icon.png' },
        { name: 'Kyosu-!', role: 'Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/kyosu_icon.png' },
      ];

      // Sort by role priority: Owner > Admin > Observer > Label > others
      const rolePriority = {
        'Owner': 0,
        'Label': 1,
        'Admin': 2,
        'Observer': 3,
      };

      function getRolePriority(role) {
        for (const [key, value] of Object.entries(rolePriority)) {
          if (role.includes(key)) return value;
        }
        return 99;
      }

      members.sort((a, b) => getRolePriority(a.role) - getRolePriority(b.role));

      members.forEach(member => {
        const card = document.createElement('article');
        card.className = 'member-card';
        card.innerHTML = `
          <div class="member-avatar">
            <img src="${member.image}" alt="${member.name}" loading="lazy">
          </div>
          <div class="member-info">
            <h2 class="member-name">${member.name}</h2>
            <p class="member-meta">${member.role}</p>
          </div>
        `;
        container.appendChild(card);
      });
    });
  </script>
</body>
</html>
