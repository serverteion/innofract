<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="innofract - Member. Experimental electronic, ambient, and digital soundscapes.">
  <title>innofract</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="images/innofract_logo_001_black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <style>
    * { paint-order: stroke fill; stroke: #6a6a6a; stroke-width: 0.5px; }
  </style>
</head>
<body>
  <!-- Header injected by script.js -->
  <div id="site-header"></div>
  
  <main>
    <section class="members-section" aria-labelledby="members-title">
      <h1 id="members-title" class="releases-title">MEMBER</h1>
      <div id="members-list" class="members-list"></div>
    </section>
  </main>
  
  <footer class="site-footer" role="contentinfo">
    <p>innofract &copy; 2026</p>
  </footer>
  
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('members-list');
      if (!container) return;
      
      const members = [
        { name: 'Supire', role: 'Owner / Music / Design / Mastering', image: 'https://i1.sndcdn.com/avatars-gNkqbxpIBeMRm1Ip-XW34YA-large.jpg' },
        { name: 'Amebre Kizami', role: 'Label / Music', image: 'images/amebre.jpg' },
        { name: 'kyou1110', role: 'Label / Music', image: 'images/kyou1110.jpg' },
        { name: 'Shishamo', role: 'Programmer', image: 'images/shishamo.jpg' },
        { name: 'oblivious', role: 'Music', image: 'images/oblivious.jpg' },
        { name: 'goropi', role: 'Music', image: 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/goropi_icon.png' },
        { name: 'スパゲテー', role: 'Music', image: 'images/spaghetti.jpg' }
      ];
      
      members.forEach(member => {
        const card = document.createElement('article');
        card.className = 'member-card';
        card.innerHTML = `
          <div class="member-avatar">
            <img src="${member.image}" alt="${member.name}" loading="lazy">
          </div>
          <div class="member-info">
            <h2 class="member-name">${member.name}</h2>
            <p class="member-meta">${member.role}</p>
          </div>
        `;
        container.appendChild(card);
      });
    });
  </script>
</body>
</html>
