<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="innofract - Blog. Essays, notes, and ramblings from the label members.">
  <title>innofract — blog</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="images/innofract_logo_001_black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <style>
    * { paint-order: stroke fill; stroke: #6a6a6a; stroke-width: 0.5px; }
    .author-page-link { display: inline-block; text-decoration: none; }
    .author-page-link:hover .blog-card-author-icon { opacity: 0.8; transition: opacity 200ms ease; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="blog-section" aria-labelledby="blog-title">
      <h1 id="blog-title" class="blog-title">BLOG</h1>

      <div id="blog-grid" class="blog-grid" role="list" aria-label="Blog articles"></div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <p>innofract &copy; 2026</p>
  </footer>

  <script src="blog/articles.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('blog-grid');
      if (!grid || typeof ARTICLES === 'undefined') return;

      const authorAvatars = {
        'Supire': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/supire_icon.png',
        'Amebre Kizami': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/amebre_kizami_icon.png',
        'kyou1110': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/kyou1110_icon.png',
        'Shishamo': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/shishamo_icon.png',
        'oblivious': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/ovlivious_icon.png',
        'goropi': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/goropi_icon.png',
        'スパゲテー': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/spgtea_icon.png',
        'melónet': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/melonet_icon.png',
        'ETH4N': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/eth4n_icon.png',
        'すてらべえ': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/stellabee_icon.png',
        'danretsu': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/danretsu_icon.png',
        'Ko-Shan': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/ko_shan_icon.png',
        'Solfrail': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/solfrail_icon.png',
        'Junk Summer': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/junk_summer_icon.png',
        'elli mia': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/elli_mia_icon.png',
        'Kyosu-!': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/kyosu_icon.png',
        'Street': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/street_icon.png',
        'Lem': 'https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/lem_icon.png'
      };

      const authorPages = {
        'Supire': 'member/supire.html'
      };

      const sorted = [...ARTICLES].sort((a, b) => b.date.localeCompare(a.date));

      sorted.forEach(article => {
        const card = document.createElement('article');
        card.className = 'blog-card';
        card.setAttribute('role', 'listitem');

        const [y, m, d] = article.date.split('-');
        const dateLabel = `${y}.${m}.${d}`;
        const authorAvatar = authorAvatars[article.author] || 'images/supirelogo.png';
        const authorPage = authorPages[article.author];

        card.innerHTML = `
          <a href="blog/${article.file}" class="blog-link" aria-label="${escapeHtml(article.title)} by ${escapeHtml(article.author)}">
            <div class="blog-card-art" role="img" aria-label="${escapeHtml(article.title)} artwork"><img src="https://raw.githubusercontent.com/serverteion/innopics/refs/heads/main/blogpics/blog001.png" alt="" class="blog-card-preview"></div>
            <div class="blog-card-body">
              <span class="blog-card-meta">${escapeHtml(dateLabel)} · ${escapeHtml(article.tone)} · ${article.length} min read</span>
              <h2 class="blog-card-title">${escapeHtml(article.title)}</h2>
              <span class="blog-card-more" data-author="${escapeHtml(article.author)}">
                ${authorPage ? `<a href="${authorPage}" class="author-page-link" aria-label="${escapeHtml(article.author)}'s profile" data-author="${escapeHtml(article.author)}">` : ''}
                  <img src="${authorAvatar}" alt="${escapeHtml(article.author)}" class="blog-card-author-icon" loading="lazy">
                ${authorPage ? '</a>' : ''}
              </span>
            </div>
          </a>
        `;
        grid.appendChild(card);
      });

      // Mouse-following tooltip
      const tooltip = document.createElement('div');
      tooltip.className = 'blog-tooltip';
      tooltip.style.cssText = `
        position: fixed;
        padding: 6px 12px;
        background: var(--bg);
        color: var(--fg);
        font-size: 0.75rem;
        font-family: var(--font-sans);
        font-weight: 500;
        white-space: nowrap;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        z-index: 100;
        box-shadow: var(--shadow);
        transition: opacity 200ms ease, visibility 200ms ease;
      `;
      document.body.appendChild(tooltip);

      // Tooltip on author page link (wraps the icon)
      grid.addEventListener('mouseover', (e) => {
        const link = e.target.closest('.author-page-link');
        if (link && link.dataset.author) {
          tooltip.textContent = link.dataset.author;
          tooltip.style.opacity = '1';
          tooltip.style.visibility = 'visible';
        }
      });

      grid.addEventListener('mousemove', (e) => {
        if (tooltip.style.opacity === '1') {
          tooltip.style.left = e.clientX + 12 + 'px';
          tooltip.style.top = e.clientY + 12 + 'px';
        }
      });

      grid.addEventListener('mouseout', (e) => {
        const link = e.target.closest('.author-page-link');
        if (link) {
          tooltip.style.opacity = '0';
          tooltip.style.visibility = 'hidden';
        }
      });

      // Prevent author page link from triggering article navigation
      grid.addEventListener('click', (e) => {
        const authorLink = e.target.closest('.author-page-link');
        if (authorLink) {
          e.stopPropagation();
        }
      });
    });
  </script>
</body>
</html>
